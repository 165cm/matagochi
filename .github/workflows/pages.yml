name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: .

      # 2026-11-24〜：deploy-pages@v4 が、上げた成果物を見つけられず（Found 0 artifact(s)）失敗が続いたため、3つとも新しい版に上げた
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
