name: Tests
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: api/package-lock.json
      - run: npm ci --prefix api --ignore-scripts
      - run: npm test --prefix api
      - run: node --test test/*.test.cjs
      - run: node --check app.js
      - run: node --check image-import.js
      - run: git diff --check
